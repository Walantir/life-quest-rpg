<link rel="stylesheet" href="/static/style.css">

<h1>Life Quest RPG</h1>

<table>
    <tr>
        <th>Дата</th>
        <th>Вес</th>
        <th>Сон</th>
    </tr>


    {% for row in checkin %}
    <tr>
        <td>{{ row[3] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
    </tr>
    {% endfor %}

</table>

{% if stats %}
<h2>Статы</h2>
<p>HP:{{ stats.hp }}</p>
<p>Ловкость:{{ stats.agility }}</p>
<p>Мана:{{ stats.mana }}</p>
{% endif %}
